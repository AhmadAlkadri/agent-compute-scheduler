# Synthetic pre-0.2.0 (schema 1) machine config, host "beta": a small WSL2
# sidecar VM (8 CPUs), no dedicated budget, an external guard path kept from
# the retired backend, one project with records in its own tree and one
# container. Neutral names and paths throughout; it stands for a real
# second-host config in the migration tests, and the private tree's release
# tests keep the two structurally equal.
schema = "agent-compute-config/1"
host = "beta"
state_dir = "~/.local/state/agent-compute"      # WSL ext4, not /mnt/c
python = "/usr/bin/python3"

[backend]
kind = "acs-guard"
guard = "~/tools/guard.py"
sha256 = "d817fd4f02ac8c20b295e217915ffd338cc12952bfa1300209559816ba47b295"
lock_wait_max_s = 43200
admission_retry_s = 120

# Machine profile of the internal guard (the numbers of the retired guard's
# profile of this host); no dedicated budget declared here.
[backend.profile]
name = "beta"
budget_gb = 5
floor_gb = 1.5
container_cpus = 8
runlog_tag = "host=beta"

[queue]
enabled = true
pueue = "/srv/example/.local/bin/pueue"
pueued = "/srv/example/.local/bin/pueued"
group = "acs-heavy"

[projects.project-a]
roots = ["~/work/project-a"]
case_prefix = ""
runlog = "docs/runlog.md"
baseline = "docs/perf/baseline-beta.json"
inputs = [".", ":(exclude)docs", ":(exclude)spec", ":(exclude)outputs",
          ":(exclude)site", ":(exclude)review-site", ":(exclude)artifacts",
          ":(exclude)node_modules", ":(exclude)scratch", ":(exclude).agents"]
env_passthrough = ["SMC_SLICE"]
max_timeout_min = 1440
max_threads = 8
containers = ["step-b"]
container_workdir = "/workspaces/project-a"
container_provenance = ".sync_provenance.json"
reserve_detector = "smc-ladder"        # the guard applied ladder detection to every job
container_limits = ["step-b"]          # the guard docker-updated every container job
