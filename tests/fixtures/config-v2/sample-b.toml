# Synthetic schema-2 machine config, host "beta": what `agent-compute config
# migrate` writes for tests/fixtures/config-v1/sample-b.toml (the legacy guard
# home kept by configuration, no dedicated budget, one project with records in
# its own tree and one container). Neutral names and paths.
schema = "agent-compute-config/2"
host = "beta"
state_dir = "~/.local/state/agent-compute"      # WSL ext4, not the Windows drive
python = "/usr/bin/python3"

[backend]
# The values versions before 0.2.0 applied implicitly, kept by configuration
guard_home = "~/.smc-guard"
marker_aliases = ["SMC_GUARD_JOB"]
legacy_workload_env = true
kind = "acs-guard"             # the internal guard, the only backend
sha256 = "d817fd4f02ac8c20b295e217915ffd338cc12952bfa1300209559816ba47b295"
lock_wait_max_s = 43200
admission_retry_s = 120

# The machine profile (the retired guard's numbers for this host, kept; no
# dedicated budget declared here; `config init` would derive 2 / 2.4 / 6 from
# its 9.713 GB)
[backend.profile]
name = "beta"
budget_gb = 5
floor_gb = 1.5
container_cpus = 8
runlog_tag = "host=beta"

[queue]
enabled = true
pueue = "/srv/example/.local/bin/pueue"
pueued = "/srv/example/.local/bin/pueued"
group = "acs-heavy"

[projects.project-a]
roots = ["~/work/project-a"]
case_prefix = ""
# in-tree records: the explicit opt-in (D3), kept by the migration
records_in_tree = true
runlog = "docs/runlog.md"
baseline = "docs/perf/baseline-beta.json"
inputs = [".", ":(exclude)docs", ":(exclude)spec", ":(exclude)outputs",
          ":(exclude)site", ":(exclude)review-site", ":(exclude)artifacts",
          ":(exclude)node_modules", ":(exclude)scratch", ":(exclude).agents"]
env_passthrough = ["SMC_SLICE"]
max_timeout_min = 1440
max_threads = 8
containers = ["step-b"]
container_workdir = "/workspaces/project-a"
container_provenance = ".sync_provenance.json"
reserve_detector = "smc-ladder"
container_limits = ["step-b"]
